<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plano de Ação — Hub SSMA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --branco:#FFFFFF; --verde:#07583C; --lima:#B3DD64; --ambar:#FDB952; --vermelho:#DF4636;
    --texto:#26302B; --suave:#6B766F; --linha:#D9E2DC; --fundo:#F4F7F5;
    --lima-bg:#EAF5CF; --ambar-bg:#FFF1D6; --vermelho-bg:#FBE0DC; --verde-bg:#DCEBE3;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--fundo);color:var(--texto);font-family:'Open Sans',sans-serif;font-size:14px}
  button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
  a{color:var(--verde)}
  .topo{background:var(--verde);color:var(--branco);padding:14px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .topo h1{margin:0;font-size:18px;font-weight:800;letter-spacing:-.01em}
  .topo .sub{font-size:12px;opacity:.8}
  .topo .espaco{flex:1}
  .usuario{font-size:12px;display:flex;align-items:center;gap:8px}
  .papel{background:var(--lima);color:var(--verde);font-weight:700;border-radius:20px;padding:2px 10px;font-size:11px}
  .topo a{color:var(--branco);font-size:12px}
  .wrap{max-width:1320px;margin:0 auto;padding:20px 24px 60px}
  .abas{display:flex;gap:6px;margin-bottom:16px}
  .aba{border:1px solid var(--linha);background:var(--branco);padding:8px 16px;border-radius:8px;cursor:pointer;font-weight:600}
  .aba.ativa{background:var(--verde);color:var(--branco);border-color:var(--verde)}
  .kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:16px}
  .kpi{background:var(--branco);border:1px solid var(--linha);border-left:5px solid var(--verde);border-radius:8px;padding:10px 12px;cursor:pointer;text-align:left}
  .kpi:hover{box-shadow:0 1px 6px rgba(7,88,60,.15)}
  .kpi.ativo{outline:2px solid var(--verde)}
  .kpi .rot{font-size:11px;color:var(--suave);font-weight:600}
  .kpi .val{font-size:26px;font-weight:800;line-height:1.1}
  .kpi.k-ambar{border-left-color:var(--ambar)} .kpi.k-lima{border-left-color:var(--lima)}
  .kpi.k-verm{border-left-color:var(--vermelho)} .kpi.k-verm .val{color:var(--vermelho)}
  .filtros{background:var(--branco);border:1px solid var(--linha);border-radius:8px;padding:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:12px}
  .filtros label{display:flex;flex-direction:column;font-size:11px;font-weight:700;color:var(--suave);gap:3px}
  .filtros select,.filtros input{border:1px solid var(--linha);border-radius:6px;padding:6px 8px;background:var(--branco);min-width:130px;max-width:230px}
  .btn{border:1px solid var(--verde);background:var(--branco);color:var(--verde);border-radius:6px;padding:7px 14px;font-weight:700;cursor:pointer}
  .btn:hover{background:var(--verde-bg)}
  .btn.p{background:var(--verde);color:var(--branco)} .btn.p:hover{background:#054630}
  .btn.l{background:var(--lima);border-color:var(--lima);color:var(--verde)}
  .btn.r{border-color:var(--vermelho);color:var(--vermelho)} .btn.r:hover{background:var(--vermelho-bg)}
  .btn:disabled{opacity:.5;cursor:default}
  .tabela-wrap{background:var(--branco);border:1px solid var(--linha);border-radius:8px;overflow-x:auto}
  table{border-collapse:collapse;width:100%}
  th{background:var(--verde);color:var(--branco);text-align:left;font-size:11px;padding:9px 10px;white-space:nowrap}
  td{padding:9px 10px;border-bottom:1px solid var(--linha);vertical-align:top}
  tbody tr{cursor:pointer} tbody tr:hover{background:var(--verde-bg)}
  td.desc{min-width:260px;max-width:420px}
  td.desc .it{font-weight:600} td.desc .ds{color:var(--suave);font-size:12px;margin-top:2px}
  .chip{display:inline-block;border-radius:20px;padding:2px 10px;font-size:11px;font-weight:700;white-space:nowrap}
  .c-aguardando_plano{background:var(--ambar-bg);color:#7A4B00;border:1px solid var(--ambar)}
  .c-plano_devolvido{background:var(--vermelho-bg);color:#8C2820;border:1px solid var(--vermelho)}
  .c-plano_enviado{background:var(--lima-bg);color:var(--verde);border:1px solid var(--lima)}
  .c-em_execucao{background:var(--branco);color:var(--verde);border:1px solid var(--verde)}
  .c-evidencia_enviada{background:var(--lima);color:var(--verde);border:1px solid var(--lima)}
  .c-concluida{background:var(--verde);color:var(--branco);border:1px solid var(--verde)}
  .c-contestada{background:var(--branco);color:#7A4B00;border:1px dashed var(--ambar)}
  .c-cancelada{background:#ECEFED;color:var(--suave);border:1px solid var(--linha)}
  .t-NC{background:var(--vermelho-bg);color:#8C2820} .t-OM{background:var(--ambar-bg);color:#7A4B00} .t-outro{background:var(--verde-bg);color:var(--verde)}
  .atraso{color:var(--vermelho);font-weight:700;font-size:11px;display:block}
  .pag{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;color:var(--suave);font-size:12px}
  .vazio{padding:30px;text-align:center;color:var(--suave)}
  /* modal */
  .fundo{position:fixed;inset:0;background:rgba(20,30,25,.5);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 12px;z-index:50}
  .fundo.aberto{display:flex}
  .modal{background:var(--branco);border-radius:10px;max-width:820px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,.25)}
  .modal-topo{background:var(--verde);color:var(--branco);padding:12px 18px;border-radius:10px 10px 0 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .modal-topo h2{margin:0;font-size:15px;flex:1}
  .modal-topo .x{background:none;border:none;color:var(--branco);font-size:22px;cursor:pointer;line-height:1}
  .modal-corpo{padding:16px 18px 20px}
  .grade{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 14px;margin-bottom:12px}
  .grade div{font-size:12px} .grade b{display:block;color:var(--suave);font-size:10px;text-transform:uppercase;letter-spacing:.03em}
  .bloco{border:1px solid var(--linha);border-radius:8px;padding:10px 12px;margin:10px 0;background:var(--fundo)}
  .bloco h3{margin:0 0 6px;font-size:12px;color:var(--verde);text-transform:uppercase;letter-spacing:.03em}
  .bloco.alerta{background:var(--ambar-bg);border-color:var(--ambar)}
  .bloco.erro{background:var(--vermelho-bg);border-color:var(--vermelho)}
  .bloco.acao{background:var(--branco);border:2px solid var(--lima)}
  .campo{display:flex;flex-direction:column;gap:3px;margin-bottom:8px;font-size:12px;font-weight:700;color:var(--suave)}
  .campo input,.campo textarea,.campo select{border:1px solid var(--linha);border-radius:6px;padding:7px 9px;font-weight:400;color:var(--texto);background:var(--branco)}
  .campo textarea{min-height:64px;resize:vertical}
  .linha-btn{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .hist{list-style:none;margin:0;padding:0}
  .hist li{border-left:3px solid var(--lima);padding:2px 0 8px 10px;margin-left:4px;font-size:12px}
  .hist .q{color:var(--suave);font-size:11px} .hist .d{margin-top:2px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:8px;color:var(--branco);font-weight:600;z-index:99;display:none;max-width:90%}
  .toast.ok{background:var(--verde)} .toast.erro{background:var(--vermelho)}
  .cartao{background:var(--branco);border:1px solid var(--linha);border-radius:10px;padding:26px;max-width:520px;margin:60px auto;text-align:center}
  @media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.grade{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div id="app"></div>
<div id="fundo" class="fundo"><div class="modal" id="modal"></div></div>
<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ===================== CONFIGURAÇÃO (preencher) ===================== */
const SUPABASE_URL = 'https://umpctnchhmyvpjwxllaj.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVtcGN0bmNoaG15dnBqd3hsbGFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQwMTI3MjAsImV4cCI6MjA4OTU4ODcyMH0.UnKDiQVtVGleKwPv1OK9AeeObM1LGjcDvvmmiyX4_iI';
const PORTAL_URL = 'https://tkichelewski-web.github.io/portal-ip/';   // link do Portal Índice de Prevenção SSMA (onde o login é feito)

/* ===================== BASE ===================== */
const STATUS = {
  aguardando_plano: 'Aguardando plano', plano_devolvido: 'Plano devolvido', plano_enviado: 'Plano em validação',
  em_execucao: 'Em execução', evidencia_enviada: 'Evidência em análise', concluida: 'Concluída',
  contestada: 'Contestada', cancelada: 'Cancelada'
};
const FECHADOS = ['concluida', 'cancelada'];
const S = { sb: null, perfil: null, acoes: [], usuarios: [], aba: 'acoes', pagina: 1, porPagina: 50,
            f: { unidade: '', gerencia: '', tipo: '', checklist: '', status: '', prazo: '', origem: '', q: '', card: '' },
            aberta: null, hist: [] };

const $ = (s, r) => (r || document).querySelector(s);
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ehAdmin = () => S.perfil && S.perfil.papel === 'admin';
function hoje() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function dataBR(iso) { if (!iso) return '—'; const p = String(iso).slice(0, 10).split('-'); return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : iso; }
function dataHoraBR(ts) { const d = new Date(ts); return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); }
function diasEntre(a, b) { return Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000); }
const atrasada = a => !!a.prazo && a.prazo < hoje() && !FECHADOS.includes(a.status);
const diasAtraso = a => diasEntre(a.prazo, hoje());
const paraValidar = a => ['plano_enviado', 'evidencia_enviada'].includes(a.status) || a.prorrog_pendente;
const aguardando = a => ['aguardando_plano', 'plano_devolvido'].includes(a.status);

function toast(msg, tipo) {
  const t = $('#toast'); t.className = 'toast ' + (tipo || 'ok'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast._t); toast._t = setTimeout(() => { t.style.display = 'none'; }, 4500);
}
function limparErro(msg) {
  return String(msg || 'Erro').replace(/^.*?(Informe|O prazo|O novo prazo|Para alterar|Só é possível|Os dados|Este campo|A validação|A devolução|A conclusão|A análise|Alteração não|Mudança de status|Ao aprovar|Seu e-mail)/s, '$1');
}

/* ===================== INÍCIO / LOGIN ===================== */
async function iniciar() {
  const app = $('#app');
  if (SUPABASE_URL.startsWith('COLE_AQUI')) {
    app.innerHTML = '<div class="cartao"><h2>Configuração pendente</h2><p>Preencha <b>SUPABASE_URL</b> e <b>SUPABASE_ANON_KEY</b> no início do script deste arquivo.</p></div>';
    return;
  }
  S.sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
  const { data } = await S.sb.auth.getSession();
  if (!data || !data.session) {
    app.innerHTML = `<div class="cartao"><h2>Plano de Ação</h2><p>Para entrar, faça o login pelo portal e volte para esta tela.</p>
      ${PORTAL_URL ? `<p><a class="btn p" style="text-decoration:none;display:inline-block" href="${esc(PORTAL_URL)}">Ir para o portal</a></p>` : ''}</div>`;
    return;
  }
  const email = (data.session.user.email || '').toLowerCase();
  const r = await S.sb.from('pa_usuarios').select('*').eq('email', email).maybeSingle();
  if (r.error || !r.data || r.data.ativo === false) {
    app.innerHTML = `<div class="cartao"><h2>Sem acesso</h2><p>O e-mail <b>${esc(email)}</b> não está liberado para o Plano de Ação. Peça ao SSMA para cadastrá-lo.</p></div>`;
    return;
  }
  S.perfil = r.data;
  await carregar();
  desenhar();
}

async function carregar() {
  let todas = [], de = 0;
  for (;;) {
    const r = await S.sb.from('pa_acoes').select('*').order('id', { ascending: true }).range(de, de + 999);
    if (r.error) { toast('Erro ao carregar: ' + r.error.message, 'erro'); break; }
    todas = todas.concat(r.data || []);
    if (!r.data || r.data.length < 1000) break;
    de += 1000;
  }
  S.acoes = todas;
  if (ehAdmin()) {
    const u = await S.sb.from('pa_usuarios').select('*').order('email', { ascending: true });
    S.usuarios = u.data || [];
  }
}

/* ===================== FILTROS ===================== */
function filtradas() {
  const f = S.f, q = f.q.trim().toLowerCase(), h = hoje();
  return S.acoes.filter(a => {
    if (f.unidade && a.unidade !== f.unidade) return false;
    if (f.gerencia && a.gerencia !== f.gerencia) return false;
    if (f.tipo && a.tipo !== f.tipo) return false;
    if (f.checklist && a.checklist !== f.checklist) return false;
    if (f.status && a.status !== f.status) return false;
    if (f.origem && a.origem !== f.origem) return false;
    if (f.prazo === 'atrasadas' && !atrasada(a)) return false;
    if (f.prazo === '7dias' && !(a.prazo && a.prazo >= h && diasEntre(h, a.prazo) <= 7 && !FECHADOS.includes(a.status))) return false;
    if (f.prazo === 'sem' && a.prazo) return false;
    if (f.card === 'aguardando' && !aguardando(a)) return false;
    if (f.card === 'validar' && !paraValidar(a)) return false;
    if (f.card === 'execucao' && a.status !== 'em_execucao') return false;
    if (f.card === 'atrasadas' && !atrasada(a)) return false;
    if (f.card === 'concluidas' && a.status !== 'concluida') return false;
    if (q) {
      const txt = [a.id, a.gerencia, a.local, a.checklist, a.item_avaliado, a.descricao, a.responsavel, a.acao, a.supervisao].join(' ').toLowerCase();
      if (!txt.includes(q)) return false;
    }
    return true;
  });
}
const distintos = campo => [...new Set(S.acoes.map(a => a[campo]).filter(Boolean))].sort((x, y) => x.localeCompare(y, 'pt-BR'));

/* ===================== TELA PRINCIPAL ===================== */
function desenhar() {
  const app = $('#app');
  app.innerHTML = `
  <div class="topo">
    <div><h1>Plano de Ação</h1><div class="sub">Hub SSMA · acompanhamento de ações, evidências e aprovação</div></div>
    <div class="espaco"></div>
    <div class="usuario"><span>${esc(S.perfil.nome || S.perfil.email)}</span><span class="papel">${ehAdmin() ? 'SSMA' : 'Gerente'}</span>
      ${PORTAL_URL ? `<a href="${esc(PORTAL_URL)}">Portal</a>` : ''}</div>
  </div>
  <div class="wrap">
    <div class="abas">
      <button class="aba ${S.aba === 'acoes' ? 'ativa' : ''}" data-aba="acoes">Ações</button>
      ${ehAdmin() ? `<button class="aba ${S.aba === 'usuarios' ? 'ativa' : ''}" data-aba="usuarios">Usuários</button>` : ''}
    </div>
    <div id="conteudo"></div>
  </div>`;
  app.querySelectorAll('[data-aba]').forEach(b => b.onclick = () => { S.aba = b.dataset.aba; desenhar(); });
  S.aba === 'usuarios' && ehAdmin() ? desenharUsuarios() : desenharAcoes();
}

function desenharAcoes() {
  const base = S.acoes;
  const c = {
    total: base.length, aguardando: base.filter(aguardando).length, validar: base.filter(paraValidar).length,
    execucao: base.filter(a => a.status === 'em_execucao').length, atrasadas: base.filter(atrasada).length,
    concluidas: base.filter(a => a.status === 'concluida').length
  };
  const kpi = (chave, rot, val, cls) => `<button class="kpi ${cls || ''} ${S.f.card === chave ? 'ativo' : ''}" data-card="${chave}"><div class="rot">${rot}</div><div class="val">${val}</div></button>`;
  const opt = (arr, atual, todos) => `<option value="">${todos}</option>` + arr.map(v => `<option value="${esc(v)}" ${v === atual ? 'selected' : ''}>${esc(v)}</option>`).join('');
  const lista = filtradas();
  const totalPag = Math.max(1, Math.ceil(lista.length / S.porPagina));
  if (S.pagina > totalPag) S.pagina = totalPag;
  const ini = (S.pagina - 1) * S.porPagina;
  const pedaco = lista.slice(ini, ini + S.porPagina);

  $('#conteudo').innerHTML = `
  <div class="kpis">
    ${kpi('', 'Total de ações', c.total)}
    ${kpi('aguardando', 'Aguardando plano', c.aguardando, 'k-ambar')}
    ${kpi('validar', 'Para validar (SSMA)', c.validar, 'k-lima')}
    ${kpi('execucao', 'Em execução', c.execucao)}
    ${kpi('atrasadas', 'Atrasadas', c.atrasadas, 'k-verm')}
    ${kpi('concluidas', 'Concluídas', c.concluidas)}
  </div>
  <div class="filtros">
    <label>Unidade<select data-f="unidade">${opt(['PB', 'JB'], S.f.unidade, 'Todas')}</select></label>
    <label>Gerência<select data-f="gerencia">${opt(distintos('gerencia'), S.f.gerencia, 'Todas')}</select></label>
    <label>Checklist<select data-f="checklist">${opt(distintos('checklist'), S.f.checklist, 'Todos')}</select></label>
    <label>Tipo<select data-f="tipo">${opt(distintos('tipo'), S.f.tipo, 'Todos')}</select></label>
    <label>Status<select data-f="status">${`<option value="">Todos</option>` + Object.keys(STATUS).map(k => `<option value="${k}" ${S.f.status === k ? 'selected' : ''}>${STATUS[k]}</option>`).join('')}</select></label>
    <label>Prazo<select data-f="prazo">
      <option value="">Todos</option><option value="atrasadas" ${S.f.prazo === 'atrasadas' ? 'selected' : ''}>Atrasadas</option>
      <option value="7dias" ${S.f.prazo === '7dias' ? 'selected' : ''}>Vencem em 7 dias</option><option value="sem" ${S.f.prazo === 'sem' ? 'selected' : ''}>Sem prazo</option></select></label>
    <label>Origem<select data-f="origem">${opt(distintos('origem'), S.f.origem, 'Todas')}</select></label>
    <label>Busca<input data-f="q" value="${esc(S.f.q)}" placeholder="texto, local, responsável…"></label>
    <button class="btn" id="limpar">Limpar</button>
    <button class="btn" id="atualizar">Atualizar</button>
    <button class="btn" id="exportar">Exportar CSV</button>
    ${ehAdmin() ? '<button class="btn p" id="nova">+ Nova ação</button>' : ''}
  </div>
  <div class="tabela-wrap">
    ${pedaco.length ? `<table><thead><tr><th>#</th><th>Un.</th><th>Gerência</th><th>Local</th><th>Checklist</th><th>Tipo</th><th>Item / descrição</th><th>Responsável</th><th>Prazo</th><th>Status</th></tr></thead><tbody>
      ${pedaco.map(a => `<tr data-id="${a.id}">
        <td>${a.id}</td><td>${esc(a.unidade)}</td><td>${esc(a.gerencia)}</td><td>${esc(a.local || '—')}</td><td>${esc(a.checklist || '—')}</td>
        <td><span class="chip ${a.tipo === 'NC' || a.tipo === 'OM' ? 't-' + a.tipo : 't-outro'}">${esc(a.tipo)}</span></td>
        <td class="desc"><div class="it">${esc(a.item_avaliado || a.descricao || '—')}</div>${a.item_avaliado && a.descricao ? `<div class="ds">${esc(a.descricao.length > 160 ? a.descricao.slice(0, 160) + '…' : a.descricao)}</div>` : ''}</td>
        <td>${esc(a.responsavel || '—')}</td>
        <td>${dataBR(a.prazo)}${atrasada(a) ? `<span class="atraso">${diasAtraso(a)} d de atraso</span>` : ''}${a.prorrog_pendente ? '<span class="atraso" style="color:#7A4B00">prorrogação pedida</span>' : ''}</td>
        <td><span class="chip c-${a.status}">${STATUS[a.status] || esc(a.status)}</span></td></tr>`).join('')}
    </tbody></table>` : '<div class="vazio">Nenhuma ação encontrada para os filtros.</div>'}
  </div>
  <div class="pag"><span>${lista.length} ação(ões) · página ${S.pagina} de ${totalPag}</span>
    <span><button class="btn" id="ant" ${S.pagina <= 1 ? 'disabled' : ''}>‹ Anterior</button> <button class="btn" id="prox" ${S.pagina >= totalPag ? 'disabled' : ''}>Próxima ›</button></span></div>`;

  document.querySelectorAll('[data-card]').forEach(b => b.onclick = () => { S.f.card = S.f.card === b.dataset.card ? '' : b.dataset.card; S.pagina = 1; desenharAcoes(); });
  document.querySelectorAll('[data-f]').forEach(el => {
    const evt = el.tagName === 'INPUT' ? 'input' : 'change';
    el.addEventListener(evt, () => {
      S.f[el.dataset.f] = el.value; S.pagina = 1;
      const pos = el.selectionStart; desenharAcoes();
      if (el.dataset.f === 'q') { const n = document.querySelector('[data-f="q"]'); n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {} }
    });
  });
  document.querySelectorAll('tbody tr').forEach(tr => tr.onclick = () => abrir(Number(tr.dataset.id)));
  $('#limpar').onclick = () => { Object.keys(S.f).forEach(k => S.f[k] = ''); S.pagina = 1; desenharAcoes(); };
  $('#atualizar').onclick = async () => { await carregar(); desenharAcoes(); toast('Dados atualizados.'); };
  $('#exportar').onclick = exportarCSV;
  $('#ant').onclick = () => { S.pagina--; desenharAcoes(); };
  $('#prox').onclick = () => { S.pagina++; desenharAcoes(); };
  if (ehAdmin()) $('#nova').onclick = abrirNova;
}

function exportarCSV() {
  const cols = ['id', 'origem', 'unidade', 'gerencia', 'supervisao', 'local', 'checklist', 'tipo', 'item_avaliado', 'descricao', 'data_origem', 'acao', 'responsavel', 'prazo', 'status', 'evidencia_link', 'evidencia_comentario', 'comentario_ssma', 'concluida_em'];
  const cel = v => { v = v == null ? '' : String(v); return /[";\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const linhas = [cols.join(';')].concat(filtradas().map(a => cols.map(c => cel(c === 'status' ? STATUS[a.status] || a.status : a[c])).join(';')));
  const blob = new Blob(['\ufeff' + linhas.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'plano-de-acao-' + hoje() + '.csv'; a.click();
}

/* ===================== DETALHE DA AÇÃO ===================== */
function fecharModal() { $('#fundo').classList.remove('aberto'); S.aberta = null; }
$('#fundo').addEventListener('mousedown', e => { if (e.target.id === 'fundo') fecharModal(); });

async function abrir(id) {
  S.aberta = id; S.hist = [];
  desenharModal();
  $('#fundo').classList.add('aberto');
  const r = await S.sb.from('pa_historico').select('*').eq('acao_id', id).order('em', { ascending: true });
  S.hist = r.data || [];
  if (S.aberta === id) desenharModal();
}

function textoHist(h) {
  const d = h.detalhes || {};
  const partes = [];
  if (h.evento === 'criada') return { t: 'Ação cadastrada', d: '' };
  if (h.evento === 'status') {
    if (d.acao && h.para_status === 'plano_enviado') partes.push(`<b>Ação:</b> ${esc(d.acao)} · <b>Responsável:</b> ${esc(d.responsavel || '')} · <b>Prazo:</b> ${dataBR(d.prazo)}`);
    if (d.comentario_ssma) partes.push(`<b>SSMA:</b> ${esc(d.comentario_ssma)}`);
    if (d.comentario_gerente) partes.push(`<b>Justificativa:</b> ${esc(d.comentario_gerente)}`);
    if (d.evidencia_link) partes.push(`<b>Evidência:</b> <a href="${esc(d.evidencia_link)}" target="_blank" rel="noopener">abrir link</a>${d.evidencia_comentario ? ' — ' + esc(d.evidencia_comentario) : ''}`);
    return { t: `${STATUS[h.de_status] || '—'} → <b>${STATUS[h.para_status] || esc(h.para_status)}</b>`, d: partes.join('<br>') };
  }
  if (h.evento === 'prorrogacao_solicitada') return { t: `Prorrogação solicitada para <b>${dataBR(d.prazo_solicitado)}</b>`, d: d.justificativa ? `<b>Justificativa:</b> ${esc(d.justificativa)}` : '' };
  if (h.evento === 'prorrogacao_aprovada') return { t: `Prorrogação aprovada: ${dataBR(d.prazo_anterior)} → <b>${dataBR(d.prazo)}</b>`, d: d.comentario_ssma ? `<b>SSMA:</b> ${esc(d.comentario_ssma)}` : '' };
  if (h.evento === 'prorrogacao_recusada') return { t: 'Prorrogação recusada', d: d.comentario_ssma ? `<b>SSMA:</b> ${esc(d.comentario_ssma)}` : '' };
  return { t: 'Ajuste de dados', d: '' };
}

function desenharModal() {

    <div><b>Origem</b>${esc(a.origem)}</div><div><b>Unidade</b>${esc(a.unidade)}</div><div><b>Data</b>${dataBR(a.data_origem)}</div>
    <div><b>Gerência</b>${esc(a.gerencia)}</div><div><b>Supervisão</b>${esc(a.supervisao || '—')}</div><div><b>Local</b>${esc(a.local || '—')}</div>
    <div><b>Checklist / tema</b>${esc(a.checklist || '—')}</div></div>`;

  }
  if (a.comentario_ssma) corpo += `<div class="bloco ${['plano_devolvido'].includes(a.status) || (a.status === 'em_execucao' && !a.evidencia_link) ? 'erro' : 'alerta'}"><h3>Retorno do SSMA</h3>${esc(a.comentario_ssma)}</div>`;

  if (a.evidencia_link) corpo += `<div class="bloco"><h3>Evidência</h3><a href="${esc(a.evidencia_link)}" target="_blank" rel="noopener">${esc(a.evidencia_link)}</a>${a.evidencia_comentario ? '<div>' + esc(a.evidencia_comentario) + '</div>' : ''}</div>`;
  if (a.prorrog_pendente) corpo += `<div class="bloco alerta"><h3>Prorrogação solicitada</h3>Novo prazo pedido: <b>${dataBR(a.prazo_solicitado)}</b><br>${esc(a.prorrog_justificativa || '')}</div>`;

  /* ----- ações disponíveis em cada status ----- */
  const st = a.status;
  if (aguardando(a)) {
    corpo += `<div class="bloco acao"><h3>${st === 'plano_devolvido' ? 'Ajustar e reenviar o plano' : 'Preencher o plano de ação'}</h3>
      <label class="campo">Ação corretiva<textarea id="f-acao">${esc(a.acao || '')}</textarea></label>
      <label class="campo">Responsável pela execução<input id="f-resp" value="${esc(a.responsavel || '')}"></label>
      <label class="campo">Prazo<input type="date" id="f-prazo" min="${hoje()}" value="${esc(a.prazo || '')}"></label>
      <div class="linha-btn"><button class="btn p" data-a="enviar_plano">Enviar plano para validação</button></div></div>`;
    if (st === 'aguardando_plano') corpo += `<div class="bloco"><h3>Não é desta área? Contestar o item</h3>
      <label class="campo">Justificativa<textarea id="f-contest"></textarea></label>
      <div class="linha-btn"><button class="btn r" data-a="contestar">Contestar</button></div></div>`;
  }

    corpo += adm ? `<div class="bloco acao"><h3>Validação do plano (SSMA)</h3>

      <label class="campo">Comentário<textarea id="f-evcom">${esc(a.evidencia_comentario || '')}</textarea></label>
      <div class="linha-btn"><button class="btn p" data-a="enviar_evidencia">Enviar evidência</button></div></div>`;
    if (!a.prorrog_pendente) corpo += `<div class="bloco"><h3>Precisa de mais prazo?</h3>
      <label class="campo">Novo prazo<input type="date" id="f-novoprazo" min="${a.prazo || hoje()}"></label>
      <label class="campo">Justificativa<textarea id="f-prorrog"></textarea></label>
      <div class="linha-btn"><button class="btn" data-a="pedir_prorrogacao">Solicitar prorrogação</button></div></div>`;
  }
  if (a.prorrog_pendente && adm) {
    corpo += `<div class="bloco acao"><h3>Decidir prorrogação (SSMA)</h3>
      <label class="campo">Comentário<textarea id="f-ssma-pr"></textarea></label>
      <div class="linha-btn"><button class="btn p" data-a="aprovar_prorrogacao">Aprovar novo prazo</button><button class="btn r" data-a="recusar_prorrogacao">Recusar</button></div></div>`;
  }
  if (st === 'evidencia_enviada') {
    corpo += adm ? `<div class="bloco acao"><h3>Conferência da evidência (SSMA)</h3>
      <label class="campo">Comentário (obrigatório para devolver)<textarea id="f-ssma"></textarea></label>
      <div class="linha-btn"><button class="btn p" data-a="concluir">Concluir ação</button><button class="btn r" data-a="devolver_evidencia">Devolver para ajuste</button></div></div>`

  if (st === 'contestada') {

      <label class="campo">Parecer (obrigatório)<textarea id="f-ssma"></textarea></label>
      <div class="linha-btn"><button class="btn p" data-a="aceitar_contestacao">Aceitar (cancelar item)</button><button class="btn r" data-a="rejeitar_contestacao">Rejeitar (volta ao gerente)</button></div></div>`
      : '<div class="bloco"><h3>Aguardando</h3>Sua contestação está em análise pelo SSMA.</div>';
  }
  if (adm) {
    corpo += `<details class="bloco"><summary style="cursor:pointer;font-weight:700">Corrigir classificação do item (SSMA)</summary>
      <label class="campo" style="margin-top:8px">Gerência<input id="f-ger" list="lista-ger" value="${esc(a.gerencia)}"></label>
      <datalist id="lista-ger">${distintos('gerencia').map(g => `<option value="${esc(g)}">`).join('')}</datalist>
      <label class="campo">Unidade<select id="f-un"><option ${a.unidade === 'PB' ? 'selected' : ''}>PB</option><option ${a.unidade === 'JB' ? 'selected' : ''}>JB</option></select></label>
      <label class="campo">Supervisão<input id="f-sup" value="${esc(a.supervisao || '')}"></label>
      <div class="linha-btn"><button class="btn" data-a="corrigir">Salvar classificação</button></div></details>`;
  }

  corpo += `<div class="bloco"><h3>Histórico</h3><ul class="hist">${S.hist.length ? S.hist.map(h => {
    const x = textoHist(h);
    return `<li><div>${x.t}</div><div class="q">${dataHoraBR(h.em)} · ${esc(h.por || 'sistema')}</div>${x.d ? `<div class="d">${x.d}</div>` : ''}</li>`;
  }).join('') : '<li>Carregando…</li>'}</ul></div>`;

  $('#modal').innerHTML = `<div class="modal-topo"><h2>Ação #${a.id}</h2>
    <span class="chip ${a.tipo === 'NC' || a.tipo === 'OM' ? 't-' + a.tipo : 't-outro'}">${esc(a.tipo)}</span>
    <span class="chip c-${a.status}">${STATUS[a.status] || esc(a.status)}</span>
    <button class="x" id="fechar" aria-label="Fechar">×</button></div><div class="modal-corpo">${corpo}</div>`;
  $('#fechar').onclick = fecharModal;
  document.querySelectorAll('#modal [data-a]').forEach(b => b.onclick = () => executar(a, b.dataset.a, b));
}

const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };

async function salvar(a, patch, ok, botao) {
  if (botao) botao.disabled = true;
  const r = await S.sb.from('pa_acoes').update(patch).eq('id', a.id).select().single();
  if (r.error || !r.data) {
    if (botao) botao.disabled = false;
    toast(r.error ? limparErro(r.error.message) : 'Sem permissão para alterar este item.', 'erro');
    return false;
  }
  Object.assign(a, r.data);
  toast(ok);
  const h = await S.sb.from('pa_historico').select('*').eq('acao_id', a.id).order('em', { ascending: true });
  S.hist = h.data || [];
  desenharModal();
  if (S.aba === 'acoes') desenharAcoes();
  return true;
}

function executar(a, acao, botao) {
  const dec = (txt) => txt || null;
  switch (acao) {
    case 'enviar_plano': {
      if (!val('f-acao') || !val('f-resp') || !val('f-prazo')) return toast('Informe a ação, o responsável e o prazo.', 'erro');
      if (val('f-prazo') < hoje()) return toast('O prazo não pode estar no passado.', 'erro');
      return salvar(a, { status: 'plano_enviado', acao: val('f-acao'), responsavel: val('f-resp'), prazo: val('f-prazo') }, 'Plano enviado para validação.', botao);
    }
    case 'contestar':
      if (!val('f-contest')) return toast('Informe a justificativa da contestação.', 'erro');
      return salvar(a, { status: 'contestada', comentario_gerente: val('f-contest') }, 'Contestação enviada ao SSMA.', botao);
    case 'validar_plano':
      return salvar(a, { status: 'em_execucao', comentario_ssma: dec(val('f-ssma')) }, 'Plano validado. A ação está em execução.', botao);
    case 'devolver_plano':
      if (!val('f-ssma')) return toast('Informe o motivo da devolução.', 'erro');
      return salvar(a, { status: 'plano_devolvido', comentario_ssma: val('f-ssma') }, 'Plano devolvido ao gerente.', botao);
    case 'enviar_evidencia':
      if (!/^https?:\/\//i.test(val('f-link'))) return toast('Informe o link da evidência (começando com http).', 'erro');
      return salvar(a, { status: 'evidencia_enviada', evidencia_link: val('f-link'), evidencia_comentario: dec(val('f-evcom')) }, 'Evidência enviada para conferência.', botao);
    case 'concluir':
      return salvar(a, { status: 'concluida', comentario_ssma: dec(val('f-ssma')) }, 'Ação concluída.', botao);
    case 'devolver_evidencia':
      if (!val('f-ssma')) return toast('Informe o que falta na evidência.', 'erro');
      return salvar(a, { status: 'em_execucao', comentario_ssma: val('f-ssma') }, 'Evidência devolvida para ajuste.', botao);
    case 'aceitar_contestacao':
      if (!val('f-ssma')) return toast('Informe o parecer.', 'erro');
      return salvar(a, { status: 'cancelada', comentario_ssma: val('f-ssma') }, 'Contestação aceita. Item cancelado.', botao);
    case 'rejeitar_contestacao':
      if (!val('f-ssma')) return toast('Informe o parecer.', 'erro');
      return salvar(a, { status: 'aguardando_plano', comentario_ssma: val('f-ssma') }, 'Contestação rejeitada. O item volta ao gerente.', botao);
    case 'pedir_prorrogacao':
      if (!val('f-novoprazo') || val('f-novoprazo') <= a.prazo) return toast('O novo prazo deve ser posterior ao prazo atual.', 'erro');
      if (!val('f-prorrog')) return toast('Informe a justificativa da prorrogação.', 'erro');
      return salvar(a, { prorrog_pendente: true, prazo_solicitado: val('f-novoprazo'), prorrog_justificativa: val('f-prorrog') }, 'Prorrogação solicitada ao SSMA.', botao);
    case 'aprovar_prorrogacao':
      return salvar(a, { prorrog_pendente: false, prazo: a.prazo_solicitado, comentario_ssma: dec(val('f-ssma-pr')) || a.comentario_ssma }, 'Prorrogação aprovada.', botao);
    case 'recusar_prorrogacao':
      return salvar(a, { prorrog_pendente: false, comentario_ssma: dec(val('f-ssma-pr')) || a.comentario_ssma }, 'Prorrogação recusada.', botao);
    case 'corrigir':
      if (!val('f-ger')) return toast('Informe a gerência.', 'erro');
      return salvar(a, { gerencia: val('f-ger'), unidade: val('f-un'), supervisao: dec(val('f-sup')) }, 'Classificação atualizada.', botao);
  }
}

    <label class="campo">Origem<input id="n-origem" list="l-origem" placeholder="Ex.: Comitê de SSMA">${lista('l-origem', distintos('origem'))}</label>
    <div class="grade" style="grid-template-columns:1fr 1fr">
      <label class="campo">Unidade<select id="n-un"><option>PB</option><option>JB</option></select></label>
      <label class="campo">Gerência<input id="n-ger" list="l-ger">${lista('l-ger', distintos('gerencia'))}</label>
      <label class="campo">Local<input id="n-local"></label>
      <label class="campo">Tema / checklist<input id="n-check"></label>
      <label class="campo">Tipo<select id="n-tipo"><option>NC</option><option>OM</option><option>Ação</option></select></label>
      <label class="campo">Data de origem<input type="date" id="n-data" value="${hoje()}"></label>
    </div>
    <label class="campo">Descrição<textarea id="n-desc"></textarea></label>
    <div class="linha-btn"><button class="btn p" id="n-salvar">Cadastrar</button></div></div>`;
  $('#fechar').onclick = fecharModal;
  $('#fundo').classList.add('aberto');
  $('#n-salvar').onclick = async () => {
    const reg = { origem: val('n-origem'), unidade: val('n-un'), gerencia: val('n-ger'), local: val('n-local') || null, checklist: val('n-check') || null,
                  tipo: val('n-tipo'), descricao: val('n-desc'), data_origem: val('n-data') || null };

    $('#u-email').value = u.email; $('#u-nome').value = u.nome || ''; $('#u-papel').value = u.papel;
    $('#u-pb').checked = (u.unidades || []).includes('PB'); $('#u-jb').checked = (u.unidades || []).includes('JB');
    [...$('#u-ger').options].forEach(o => o.selected = (u.gerencias || []).includes(o.value));
    window.scrollTo(0, 0);
  });
  document.querySelectorAll('[data-ativo]').forEach(b => b.onclick = async () => {
    const u = S.usuarios.find(x => x.email === b.dataset.ativo); if (!u) return;
    const r = await S.sb.from('pa_usuarios').update({ ativo: !u.ativo }).eq('email', u.email).select().single();
    if (r.error) return toast(r.error.message, 'erro');
    u.ativo = r.data.ativo; desenharUsuarios(); toast('Usuário atualizado.');
  });
  $('#u-salvar').onclick = async () => {
    const email = val('u-email').toLowerCase();
    if (!/^\S+@\S+\.\S+$/.test(email)) return toast('Informe um e-mail válido.', 'erro');
    const unidades = [$('#u-pb').checked ? 'PB' : null, $('#u-jb').checked ? 'JB' : null].filter(Boolean);
    const gerencias = [...$('#u-ger').selectedOptions].map(o => o.value);
    const papel = val('u-papel');
    if (papel === 'gerente' && (!unidades.length || !gerencias.length)) return toast('Para gerente, marque ao menos uma unidade e uma gerência.', 'erro');
    const r = await S.sb.from('pa_usuarios').upsert({ email, nome: val('u-nome') || null, papel, unidades, gerencias, ativo: true }, { onConflict: 'email' }).select().single();
    if (r.error) return toast(r.error.message, 'erro');
    const i = S.usuarios.findIndex(x => x.email === email);
    if (i >= 0) S.usuarios[i] = r.data; else S.usuarios.push(r.data);
    desenharUsuarios(); toast('Usuário salvo.');
  };
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharModal(); });
iniciar();
</script>
</body>
</html>
